<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#8e1f35">
<meta name="robots" content="noindex">
<title>بيونيا فلاورز | ورد وهدايا في المعادي، بنجهزهالك بحب</title>
<meta name="description" content="بيونيا فلاورز | بوكيهات ورد وهدايا في سرايات المعادي">
<meta property="og:type" content="website">
<meta property="og:title" content="بيونيا فلاورز | ورد وهدايا في المعادي، بنجهزهالك بحب">
<meta property="og:description" content="بيونيا فلاورز | بوكيهات ورد وهدايا في سرايات المعادي">
<meta property="og:image" content="img/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:locale" content="ar_AR">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="img/icon.png">
<link rel="apple-touch-icon" href="img/icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&amp;family=Inter:wght@400;600;700&amp;display=swap" media="print" onload="this.media='all'">
<style>
  :root{--brand:#8e1f35;--accent:#a32a4c;--bg:#fff7f8;--ink:#2b1519;--muted:#665457;--on:#ffffff;--f:"Inter","IBM Plex Sans Arabic",system-ui,sans-serif;--card:#fff;--wa:#0e7a3e;--line:color-mix(in srgb,var(--brand) 14%,var(--bg))}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:var(--f);background:var(--bg);color:var(--ink);line-height:1.65;padding-bottom:150px}
  a{color:inherit}
  button,select{font:inherit;color:inherit}
  :focus-visible{outline:3px solid var(--accent);outline-offset:2px}
  .pv{background:#111;color:#f5f5f5;font-size:.85rem;text-align:center;padding:.5rem 1rem;position:sticky;top:0;z-index:40}
  .pv b{color:#ffd27a}
  .wrap{max-width:960px;margin:0 auto;padding:0 16px}

  .hero{background:var(--brand);color:var(--on);padding:14px 0 22px;position:relative;overflow:hidden}
  .hero::before{content:"";position:absolute;top:-55%;inset-inline-end:-35%;width:min(110vw,820px);aspect-ratio:1;border-radius:50%;background:radial-gradient(closest-side,color-mix(in srgb,var(--accent) 55%,transparent),transparent);pointer-events:none}
  .hero .wrap{position:relative}
  .top{display:flex;align-items:center;gap:10px}
  .top img{width:48px;height:48px;border-radius:14px;background:var(--bg);object-fit:contain}
  .top .nm{flex:1;font-weight:700;line-height:1.3;min-width:0}
  .lang{min-width:48px;min-height:44px;border-radius:99px;border:1px solid color-mix(in srgb,var(--on) 40%,transparent);background:none;color:var(--on);font-weight:700;cursor:pointer}
  h1{font-size:clamp(1.9rem,8.6vw,3.1rem);line-height:1.15;margin:18px 0 6px;letter-spacing:-.01em}
  .tag{font-size:1.02rem;max-width:34em}
  .chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
  .chip{font-size:.82rem;padding:.2rem .75rem;border-radius:99px;background:color-mix(in srgb,var(--on) 14%,transparent)}
  .fl{font-size:.82rem;font-weight:700;margin-top:18px;letter-spacing:.02em}
  .feat{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;margin:8px -16px 0;padding:0 16px 6px;scrollbar-width:none}
  .feat a{flex:none;width:min(160px,calc((min(100vw,960px) - 52px)/3.15));scroll-snap-align:start;text-decoration:none;background:var(--card);color:var(--ink);border-radius:18px;padding:5px 5px 9px;box-shadow:0 10px 24px rgb(0 0 0/.18)}
  .feat img{display:block;width:100%;height:auto;aspect-ratio:1;object-fit:cover;border-radius:14px}
  .feat b{display:block;font-size:.8rem;line-height:1.35;margin:6px 4px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .feat span{display:block;font-size:.78rem;font-weight:700;color:var(--accent);margin:0 4px}

  /* space reserved before data.json renders, so nothing jumps (CLS) */
  .chips{min-height:30px}.fl{min-height:1.4em}
  .feat:empty{min-height:calc(min(160px,(min(100vw,960px) - 52px)/3.15) + 62px)}
  main:empty{min-height:200vh}
  .bar{position:sticky;top:var(--pvh,0);z-index:20;background:color-mix(in srgb,var(--bg) 94%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
  .tabs{display:flex;gap:8px;overflow-x:auto;padding:10px 0;scrollbar-width:none}
  .tabs button{flex:none;min-height:44px;padding:0 1.1rem;border-radius:99px;border:1px solid var(--line);background:var(--card);font-weight:600;cursor:pointer}
  .tabs [aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--on)}

  main section,.card{scroll-margin-top:calc(var(--pvh,0px) + 72px)}
  main section{padding:22px 0 6px}
  h2{font-size:1.45rem;line-height:1.3;color:var(--brand);margin-bottom:12px}
  .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:20px;overflow:hidden;display:flex;flex-direction:column}
  .card>img{display:block;width:100%;height:auto;aspect-ratio:1;object-fit:cover;background:var(--line)}
  .info{padding:10px 12px 12px;display:flex;flex-direction:column;gap:2px;flex:1;min-width:0}
  .info b{font-size:.98rem;line-height:1.4;overflow-wrap:anywhere}
  .desc{font-size:.8rem;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .pick{display:block;margin-top:6px;font-size:.78rem;color:var(--muted)}
  .pick select{display:block;width:100%;min-height:44px;margin-top:2px;padding:0 8px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink)}
  .foot{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px;margin-top:auto;padding-top:10px}
  .price{font-weight:700;color:var(--accent);white-space:nowrap}
  .add{min-height:44px;min-width:44px;padding:0 1rem;border:0;border-radius:99px;background:var(--brand);color:var(--on);font-weight:700;cursor:pointer;white-space:nowrap}
  .step{display:flex;align-items:center;background:var(--brand);color:var(--on);border-radius:99px}
  .step button{width:44px;height:44px;border:0;background:none;font-size:1.25rem;cursor:pointer}
  .step span{min-width:1.2rem;text-align:center;font-weight:700}

  .boxes{display:grid;gap:12px}
  .box{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px}
  .box h3{font-size:1rem;margin-bottom:.3rem}
  .box p,.box li{color:var(--muted);font-size:.92rem;white-space:pre-line}
  .box ul{list-style:none}
  .box li{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px dashed var(--line)}
  .box li:last-child{border:0}
  .box a{display:inline-flex;align-items:center;min-height:44px;font-weight:600;color:var(--brand)}
  footer{color:var(--muted);font-size:.82rem;text-align:center;padding:28px 16px 8px}

  .cart{position:fixed;inset:auto 0 0 0;z-index:30;background:var(--card);border-top:1px solid var(--line);box-shadow:0 -10px 30px rgb(0 0 0/.12);padding:10px 0 calc(10px + env(safe-area-inset-bottom));transform:translateY(110%);transition:transform .25s ease}
  .cart.on{transform:none}
  .crow{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .crow span{font-size:.9rem;font-weight:600;white-space:nowrap}
  .crow select{flex:1 1 auto;max-width:60%;min-width:0;min-height:44px;padding:0 8px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink)}
  .crow select.need{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
  .btn{display:flex;align-items:center;justify-content:center;min-height:48px;margin-top:8px;border-radius:99px;background:var(--wa);color:#fff;font-weight:700;text-decoration:none}
  @media (min-width:700px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}.boxes{grid-template-columns:repeat(3,1fr)}}
  @media (min-width:900px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
  @media (prefers-reduced-motion:reduce){.cart{transition:none}}
</style>
</head>
<body>

<div class="pv" id="pv" hidden></div>

<header class="hero">
  <div class="wrap">
    <div class="top"><img src="img/logo.webp" alt="" width="48" height="48"><span class="nm"></span><button class="lang" id="lang" hidden></button></div>
    <h1 id="h1">بيونيا فلاورز</h1>
    <p class="tag" id="tag">ورد وهدايا في المعادي، بنجهزهالك بحب</p>
    <div class="chips" id="chips"></div>
    <p class="fl" data-t="featured"></p>
    <div class="feat" id="feat"></div>
  </div>
</header>

<nav class="bar" id="bar"><div class="wrap"><div class="tabs" id="tabs"></div></div></nav>

<main class="wrap" id="catalog"></main>

<section class="wrap" style="padding-top:26px">
  <h2 data-t="info"></h2>
  <div class="boxes">
    <div class="box"><h3 data-t="hours"></h3><p id="hours"></p><a id="chat" href="#" data-t="chat"></a></div>
    <div class="box" id="zbox"><h3 data-t="zones"></h3><ul id="zones"></ul></div>
    <div class="box" id="abox"><h3 data-t="addr"></h3><p id="addr"></p><a id="map" target="_blank" rel="noopener" data-t="map"></a></div>
  </div>
</section>

<footer id="foot"></footer>

<div class="cart" id="cart" aria-live="polite">
  <div class="wrap">
    <div class="crow"><span id="sum"></span><select id="zone"></select></div>
    <a class="btn" id="waOrder" href="#" data-t="order"></a>
  </div>
</div>

<script type="module">
// shop settings are baked in at build time; products, hours and delivery zones live in data.json (owner edits them from /admin)
const CFG = {"name": "بيونيا فلاورز", "name_en": "Peonia Flowers", "tagline": "ورد وهدايا في المعادي، بنجهزهالك بحب", "tagline_en": "", "address": "شارع بورسعيد، سرايات المعادي", "address_en": "", "map": "Peonia Flowers Port Said Street Maadi", "currency": "EGP", "wa": "201028814991", "preview": true, "langs": ["ar"]};
const DATA = await (await fetch("data.json", {cache: "no-cache"})).json();
const T = {
  ar: {featured: "الأكثر طلبًا", info: "معلومات المحل", hours: "مواعيد العمل", zones: "التوصيل ورسومه", addr: "العنوان", map: "افتح في خرائط جوجل ←", chat: "تواصل معنا على واتساب ←",
       order: "أرسل الطلب على واتساب", add: "+ أضف", addA: "أضف", less: "إزالة واحد", more: "إضافة واحد", size: "الحجم", pick: "اختر منطقة التوصيل", free: "مجانًا", poa: "السعر عند الطلب", sections: "أقسام الكتالوج",
       pv: "<b>معاينة</b> · الطلب على واتساب يعمل بعد تفعيل الموقع", pvAlert: "هذه معاينة: الطلب على واتساب يعمل بعد تفعيل الموقع", prices: "الأسعار بـ",
       head: "طلب جديد من موقع", sub: "المجموع", del: "التوصيل", total: "الإجمالي", form: "الاسم:\nالعنوان:\nموعد التوصيل:", hello: "مرحبًا",
       count: n => n === 1 ? "منتج واحد" : n === 2 ? "منتجان" : n <= 10 ? `${n} منتجات` : `${n} منتجًا`},
  en: {featured: "Most loved", info: "Shop info", hours: "Opening hours", zones: "Delivery & fees", addr: "Address", map: "Open in Google Maps →", chat: "Chat with us on WhatsApp →",
       order: "Send order on WhatsApp", add: "+ Add", addA: "Add", less: "Remove one", more: "Add one", size: "Size", pick: "Choose delivery area", free: "Free", poa: "Price on request", sections: "Catalog sections",
       pv: "<b>Preview</b> · WhatsApp ordering turns on after activation", pvAlert: "This is a preview: WhatsApp ordering turns on after activation", prices: "Prices in ",
       head: "New order from", sub: "Subtotal", del: "Delivery", total: "Total", form: "Name:\nAddress:\nDelivery time:", hello: "Hello",
       count: n => n === 1 ? "1 item" : `${n} items`}
};
// d = decimals (KWD has 3 fils digits); AED/SAR show decimals only when the price has them
const C = {EGP: {d: 0, ar: "ج.م", en: "EGP", nar: "الجنيه المصري", nen: "Egyptian pounds"},
           AED: {d: 2, ar: "د.إ", en: "AED", nar: "الدرهم الإماراتي", nen: "UAE dirhams"},
           SAR: {d: 2, ar: "ر.س", en: "SAR", nar: "الريال السعودي", nen: "Saudi riyals"},
           KWD: {d: 3, ar: "د.ك", en: "KWD", nar: "الدينار الكويتي", nen: "Kuwaiti dinars"}}[CFG.currency];

const $ = s => document.querySelector(s);
const esc = v => String(v ?? "").replace(/[&<>"']/g, ch => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"})[ch]);  // owner-typed text from the panel
let L = (() => { try { return localStorage.getItem("lang"); } catch { return null; } })();
if (!CFG.langs.includes(L)) L = CFG.langs[0];
const t = (o, k) => (L === "en" && o[k + "_en"]) || o[k] || "";  // bilingual field, falls back to Arabic
const minor = p => Math.round(p * 10 ** C.d);  // money is summed in fils/piastres so 3 × 4.750 stays exact
const money = m => {
  const n = (m / 10 ** C.d).toLocaleString("en-US", {minimumFractionDigits: C.d === 3 ? 3 : m % 10 ** C.d ? C.d : 0, maximumFractionDigits: C.d});
  return L === "ar" ? `${n} ${C.ar}` : `${C.en} ${n}`;
};
const waLink = text => `https://wa.me/${CFG.wa}?text=${encodeURIComponent(text)}`;

const ITEMS = DATA.items.filter(it => !it.hide);
const CATS = DATA.cats.filter(c => ITEMS.some(it => it.c === c.id));
const ZONES = DATA.zones || [];
const sel = ITEMS.map(it => ({s: it.sz?.length ? 0 : "", o: it.o?.length ? 0 : ""}));  // chosen size/option per card
const cart = {};  // key "i@size#option" -> qty, so each choice is its own order line
let zone = "";
const keyOf = i => `${i}@${sel[i].s}#${sel[i].o}`;
const priceOf = (it, s) => minor(+(s !== "" ? it.sz[s].p : it.p) || 0);  // 0 = price on request, left out of totals
const priceTxt = (it, s) => priceOf(it, s) ? money(priceOf(it, s)) : T[L].poa;

const pv = $("#pv");
pv.hidden = !CFG.preview;

function render(){
  const R = T[L], H = document.documentElement;
  H.lang = L; H.dir = L === "ar" ? "rtl" : "ltr";
  document.querySelectorAll("[data-t]").forEach(e => e.textContent = R[e.dataset.t]);
  pv.innerHTML = R.pv;
  H.style.setProperty("--pvh", (CFG.preview ? pv.offsetHeight : 0) + "px");
  $("#h1").textContent = t(CFG, "name");
  $("#tag").textContent = t(CFG, "tagline");
  const lb = $("#lang");
  lb.hidden = CFG.langs.length < 2;
  lb.textContent = L === "ar" ? "EN" : "ع";
  lb.setAttribute("aria-label", L === "ar" ? "English (EN)" : "العربية");
  $("#bar").setAttribute("aria-label", R.sections);

  $("#chips").innerHTML = [t(DATA, "hours").split("\n")[0], ZONES.length && `${R.del} · ${ZONES.map(z => t(z, "l")).slice(0, 3).join("، ")}${ZONES.length > 3 ? "…" : ""}`]
    .filter(Boolean).map(c => `<span class="chip">${esc(c)}</span>`).join("");

  const idx = ITEMS.map((it, i) => i), feat = idx.filter(i => ITEMS[i].feat);
  $("#feat").innerHTML = (feat.length ? feat : idx).slice(0, 5).map(i => `
    <a href="#p${i}"><img src="${esc(ITEMS[i].img)}" alt="${esc(t(ITEMS[i], "n"))}" width="160" height="160"><b>${esc(t(ITEMS[i], "n"))}</b><span>${priceTxt(ITEMS[i], sel[i].s)}</span></a>`).join("");

  $("#tabs").innerHTML = CATS.map((c, ci) => `<button aria-pressed="${ci === 0}" data-t="c${ci}">${esc(t(c, "l"))}</button>`).join("");
  $("#catalog").innerHTML = CATS.map((c, ci) => `
    <section id="c${ci}"><h2>${esc(t(c, "l"))}</h2><div class="grid">${
      ITEMS.map((it, i) => it.c !== c.id ? "" : `
        <article class="card" id="p${i}">
          <img src="${esc(it.img)}" alt="${esc(t(it, "n"))}" width="400" height="400" loading="lazy">
          <div class="info">
            <b>${esc(t(it, "n"))}</b>
            ${t(it, "d") ? `<span class="desc">${esc(t(it, "d"))}</span>` : ""}
            ${it.sz?.length ? `<label class="pick">${R.size}<select data-s="${i}">${it.sz.map((z, k) => `<option value="${k}"${k == sel[i].s ? " selected" : ""}>${esc(t(z, "l"))}</option>`).join("")}</select></label>` : ""}
            ${it.o?.length ? `<label class="pick">${esc(t(it, "ol"))}<select data-o="${i}">${it.o.map((z, k) => `<option value="${k}"${k == sel[i].o ? " selected" : ""}>${esc(t(z, "l"))}</option>`).join("")}</select></label>` : ""}
            <div class="foot"><span class="price" data-p="${i}">${priceTxt(it, sel[i].s)}</span><span class="ctl" data-i="${i}"></span></div>
          </div>
        </article>`).join("")}</div></section>`).join("");
  ITEMS.forEach((_, i) => renderCtl(i));

  $("#hours").textContent = t(DATA, "hours");
  $("#chat").href = CFG.preview ? "#" : waLink(`${R.hello} ${t(CFG, "name")}`);
  $("#zbox").hidden = !ZONES.length;
  $("#zones").innerHTML = ZONES.map(z => `<li><span>${esc(t(z, "l"))}</span><span>${z.fee ? money(minor(z.fee)) : R.free}</span></li>`).join("");
  $("#abox").hidden = !CFG.address;
  $("#addr").textContent = t(CFG, "address");
  $("#map").href = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(CFG.map || CFG.address || "")}`;
  $("#foot").textContent = `© ${t(CFG, "name")} · ${R.prices}${L === "ar" ? C.nar : C.nen}`;
  $("#zone").hidden = !ZONES.length;
  $("#zone").setAttribute("aria-label", R.pick);
  $("#zone").innerHTML = `<option value="">${R.pick}</option>` + ZONES.map((z, k) => `<option value="${k}"${k == zone && zone !== "" ? " selected" : ""}>${esc(t(z, "l"))} · ${z.fee ? money(minor(z.fee)) : R.free}</option>`).join("");
  updateCart();
}

function renderCtl(i){
  const R = T[L], q = cart[keyOf(i)] || 0, el = $(`.ctl[data-i="${i}"]`);
  el.innerHTML = q ? `<span class="step"><button data-a="-1" aria-label="${R.less}">−</button><span>${q}</span><button data-a="1" aria-label="${R.more}">+</button></span>`
                   : `<button class="add" data-a="1" aria-label="${R.addA} ${esc(t(ITEMS[i], "n"))}">${R.add}</button>`;
}

function orderText(){
  const R = T[L];
  const lines = Object.entries(cart).map(([k, q]) => {
    const [i, s, o] = k.split(/[@#]/), it = ITEMS[i];
    const extra = [s !== "" && t(it.sz[s], "l"), o !== "" && t(it.o[o], "l")].filter(Boolean).join(" / ");
    return {q, m: priceOf(it, s) * q, txt: `• ${q} × ${t(it, "n")}${extra ? ` (${extra})` : ""}`};
  });
  const sub = lines.reduce((a, l) => a + l.m, 0), z = zone !== "" ? ZONES[zone] : null, fee = z ? minor(z.fee || 0) : 0;
  return {count: lines.reduce((a, l) => a + l.q, 0), sub, text:
    `${R.head} ${t(CFG, "name")}\n` + lines.map(l => `${l.txt} — ${l.m ? money(l.m) : R.poa}`).join("\n") +
    // sub 0 = every item is price-on-request: leave out the 0 subtotal and total lines
    (sub ? `\n\n${R.sub}: ${money(sub)}` : "") + (z ? `${sub ? "\n" : "\n\n"}${R.del}: ${t(z, "l")} (${fee ? money(fee) : R.free})` : "") +
    (sub ? `\n${R.total}: ${money(sub + fee)}${lines.some(l => !l.m) ? ` + ${R.poa}` : ""}` : "") + `\n\n${R.form}`};
}

function updateCart(){
  const {count, sub, text} = orderText();
  $("#sum").textContent = T[L].count(count) + (sub ? ` · ${money(sub)}` : "");
  $("#waOrder").href = CFG.preview ? "#" : waLink(text);
  $("#cart").classList.toggle("on", count > 0);
}

const main = $("#catalog");
main.addEventListener("click", e => {
  const b = e.target.closest("button[data-a]"); if (!b) return;
  const i = +b.closest(".ctl").dataset.i, k = keyOf(i);
  cart[k] = Math.max(0, (cart[k] || 0) + +b.dataset.a);
  if (!cart[k]) delete cart[k];
  renderCtl(i);
  updateCart();
});
main.addEventListener("change", e => {
  const s = e.target.closest("select"), i = +(s.dataset.s ?? s.dataset.o);
  sel[i][s.dataset.s !== undefined ? "s" : "o"] = s.value;
  $(`.price[data-p="${i}"]`).textContent = priceTxt(ITEMS[i], sel[i].s);
  renderCtl(i);
});
$("#tabs").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  $("#tabs").querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", x === b));
  document.getElementById(b.dataset.t).scrollIntoView({behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth"});
});
$("#zone").addEventListener("change", e => { zone = e.target.value; e.target.classList.remove("need"); updateCart(); });
$("#waOrder").addEventListener("click", e => {
  if (CFG.preview) { e.preventDefault(); alert(T[L].pvAlert); }
  else if (ZONES.length && zone === "") { e.preventDefault(); $("#zone").classList.add("need"); $("#zone").focus(); }
});
$("#chat").addEventListener("click", e => { if (CFG.preview) { e.preventDefault(); alert(T[L].pvAlert); } });
$("#lang").addEventListener("click", () => {
  L = L === "ar" ? "en" : "ar";
  try { localStorage.setItem("lang", L); } catch {}
  render();
});
render();
</script>
</body>
</html>
